# LangMap single-goal (HieraNav) on HM3D v0.2 val. Episodes built by
# tools/build_langmap.py; success = within 0.25 m of a goal viewpoint, as in
# the official LangMap config. Camera/agent stay at harnessvln's settings.
SEED: 0
ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
SIMULATOR:
  ACTION_SPACE_CONFIG: v1
  AGENT_0:
    SENSORS: [RGB_SENSOR, DEPTH_SENSOR]
    HEIGHT: 0.88
    RADIUS: 0.1
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 30
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  RGB_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
    TYPE: HabitatSimRGBSensor
  DEPTH_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    MIN_DEPTH: 0.1
    MAX_DEPTH: 5.0
    POSITION: [0, 0.88, 0]
  TYPE:
    Sim-v1
TASK:
  TYPE: VLN-v0
  SUCCESS_DISTANCE: 0.25
  SENSORS: [
    INSTRUCTION_SENSOR,
    SENSOR_POSE_SENSOR,
    POSITION_SENSOR,
    HEADING_SENSOR
  ]
  INSTRUCTION_SENSOR_UUID: instruction
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT, LOOK_UP, LOOK_DOWN]
  MEASUREMENTS: [
    DISTANCE_TO_GOAL,
    SUCCESS,
    SPL,
    PATH_LENGTH,
    ORACLE_SUCCESS,
    STEPS_TAKEN,
    POSITION
  ]
  SUCCESS:
    SUCCESS_DISTANCE: 0.25
  SPL:
    SUCCESS_DISTANCE: 0.25
  NDTW:
    SUCCESS_DISTANCE: 0.25
    GT_PATH: data/datasets/episodes/langmap_gt.json.gz
  SDTW:
    SUCCESS_DISTANCE: 0.25
    GT_PATH: data/datasets/episodes/langmap_gt.json.gz
  ORACLE_SUCCESS:
    SUCCESS_DISTANCE: 0.25
DATASET:
  TYPE: VLN-CE-v1
  SPLIT: val
  DATA_PATH: data/datasets/episodes/langmap.json.gz
  SCENES_DIR: data/scene_datasets/
